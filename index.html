<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SlopiFY — Private music streaming for friends. Upload, share, and listen together." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="google-site-verification" content="Wf4mx_9qwhD9CawUAoB9YgB6b6oxXQLaVpmiQ6XVeGg" />
    <link rel="canonical" href="https://slopify-nu.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>SlopiFY — Music for the homies</title>

    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://slopify-nu.vercel.app/" />
    <meta property="og:title" content="SlopiFY — Music for the homies" />
    <meta property="og:description" content="Private music streaming web app for friends. Upload, share, and listen together in real-time." />
    <meta property="og:image" content="https://slopify-nu.vercel.app/blueberry_wallpaper.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SlopiFY — Music for the homies" />
    <meta name="twitter:description" content="Private music streaming web app for friends. Upload, share, and listen together in real-time." />
    <meta name="twitter:image" content="https://slopify-nu.vercel.app/blueberry_wallpaper.webp" />

    <!-- Performance Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />

    <!-- Speculation Rules for Instant SPA Navigations -->
    <script type="speculationrules">
    {
      "prerender": [
        {
          "where": { "href_matches": "/*" },
          "eagerness": "moderate"
        }
      ]
    }
    </script>

    <!-- Fast Google Fonts (only essential weights + swap display) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" /></noscript>

    <!-- Critical inline CSS for instant zero-delay first paint -->
    <style>
      body{margin:0;background:#0c0a16;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif;font-display:swap}
      #root{min-height:100vh;min-height:100dvh}
      .app-loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:#94A3B8;font-size:.8125rem}
      .app-loading-screen .spinner{width:36px;height:36px;border:3px solid #1F1F1F;border-top-color:#F8FAFC;border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>

    <!-- Preload hero background image (matches login-bg.png used in CSS) -->
    <link rel="preload" href="/login-bg.png" as="image" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
