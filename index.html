<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SlopiFY — Private music streaming for friends. Upload, share, and listen together." />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <link rel="canonical" href="https://slopify-nu.vercel.app/" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" as="image" href="/login-bg.webp" />
    <meta name="theme-color" content="#0c0a16">
    <title>SlopiFY — Music for the homies</title>

    <!-- Open Graph / Social SEO -->
    <meta name="application-name" content="SlopiFY" />
    <meta property="og:site_name" content="SlopiFY" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://slopify-nu.vercel.app/" />
    <meta property="og:title" content="SlopiFY — Music for the homies" />
    <meta property="og:description" content="Private music streaming web app for friends. Upload, share, and listen together in real-time." />
    <meta property="og:image" content="https://slopify-nu.vercel.app/login-bg.png" />

    <!-- Structured Data (JSON-LD) for Search Crawlers & AI Summarizers -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://slopify-nu.vercel.app/#website",
            "name": "SlopiFY",
            "alternateName": ["Slopify", "SlopiFY Music"],
            "url": "https://slopify-nu.vercel.app/",
            "description": "Private communal music streaming web app for friends. Upload, stream, and share high-quality audio in real-time."
          },
          {
            "@type": "WebApplication",
            "@id": "https://slopify-nu.vercel.app/#webapp",
            "name": "SlopiFY",
            "url": "https://slopify-nu.vercel.app/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "All",
            "browserRequirements": "Requires JavaScript and HTML5 Audio support",
            "description": "Lightweight, communal music streaming platform featuring multi-format audio playback, ID3 metadata parsing, and shared playlists.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
    </script>

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SlopiFY — Music for the homies" />
    <meta name="twitter:description" content="Private music streaming web app for friends. Upload, share, and listen together in real-time." />
    <meta name="twitter:image" content="https://slopify-nu.vercel.app/login-bg.png" />

    <!-- Performance Preconnects (max 4 — only origins needed on first load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://slopify-a4cda.firebaseapp.com" />
    <link rel="preconnect" href="https://apis.google.com" />

    <!-- Fast Google Fonts (only essential weights + swap display) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" /></noscript>

    <!-- Critical inline CSS for instant zero-delay first paint -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;background:#484F56;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed}
      #root{min-height:100vh;min-height:100dvh}
      /* Login page critical styles — painted before any CSS file loads */
      .login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:1rem;position:relative;background:#1a1a2e url('/login-bg.webp') center/cover no-repeat}
      .login-bg-pattern{position:fixed;inset:0;pointer-events:none;z-index:0}
      .login-card-wrapper{position:relative;z-index:1;width:100%;max-width:420px}
      .login-card{background:rgba(255,255,255,.07);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:2rem;will-change:auto}
      .login-header{text-align:center;margin-bottom:1.5rem}
      .login-title{font-size:1.5rem;font-weight:700;margin:.5rem 0 .25rem}
      .login-subtitle{color:rgba(255,255,255,.6);font-size:.875rem;margin:0}
      /* Prevent layout shift for inputs */
      .input-wrapper{position:relative;display:flex;align-items:center}
      .input-wrapper input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:.9375rem;padding:.75rem 1rem .75rem 2.75rem;outline:none}
    </style>
  </head>
  <body>

    <!--
      Pre-rendered loading shell — visible on frame 0 before React boots.
      React replaces this once it hydrates, so there is no flash.
    -->
    <div id="root"></div>

    <!--
      Semantic crawler fallback in <noscript>.
      Browsers with JavaScript ignore this entirely (0 layout shift, 0 paint impact).
      Crawlers without JS execution read this to index page topics, headings, and keywords.
    -->
    <noscript>
      <div style="padding: 2rem; max-width: 800px; margin: 0 auto; font-family: sans-serif; color: #fff;">
        <h1>SlopiFY — Music for the Homies</h1>
        <p>SlopiFY is a private communal music streaming web application designed for friends. Upload, share, and listen together in real-time with zero subscription fees.</p>
        <h2>Key Features</h2>
        <ul>
          <li><strong>Communal Music Library:</strong> Stream audio tracks with zero delay and instant scrubbing.</li>
          <li><strong>Multi-Format Audio Support:</strong> High-fidelity playback for MP3, FLAC, WAV, M4A, and OGG formats.</li>
          <li><strong>Collaborative Playlists:</strong> Create, share, and reorder custom music playlists.</li>
          <li><strong>Client-Side Tag Parsing:</strong> Automatic ID3 and album artwork extraction on upload.</li>
        </ul>
        <p><a href="/login" style="color: #60a5fa;">Click here to log in to SlopiFY</a></p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
